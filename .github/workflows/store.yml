name: Submit to Store

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published, tested release tag (for example v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: store-submission
  cancel-in-progress: false

jobs:
  submit:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      STORE_PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
    steps:
      - name: Download reviewed Store package
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Use a release tag such as v1.0.0.'
          }
          if (!$env:STORE_PRODUCT_ID) { throw 'Set the STORE_PRODUCT_ID repository variable.' }
          $release = gh release view $env:RELEASE_TAG --json isDraft,isPrerelease | ConvertFrom-Json
          if ($release.isDraft -or $release.isPrerelease) { throw 'Publish and test the release first.' }
          $bundle = "smol-auto-clicker-$env:RELEASE_TAG-store.msixbundle"
          gh release download $env:RELEASE_TAG --pattern $bundle --pattern SHA256SUMS.txt
          $line = @(Get-Content SHA256SUMS.txt | Where-Object { $_.EndsWith("  $bundle") })
          if ($line.Count -ne 1 -or ($line[0] -split '  ')[0] -ne (Get-FileHash $bundle -Algorithm SHA256).Hash) {
            throw 'Store package checksum does not match the release.'
          }
      - uses: microsoft/microsoft-store-apppublisher@v1.1
      - name: Submit reviewed package for certification
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($name in 'AZURE_AD_TENANT_ID', 'AZURE_AD_APPLICATION_CLIENT_ID', 'AZURE_AD_APPLICATION_SECRET', 'SELLER_ID') {
            if (![Environment]::GetEnvironmentVariable($name)) { throw "Set the $name repository secret." }
          }
          msstore reconfigure --tenantId $env:AZURE_AD_TENANT_ID --sellerId $env:SELLER_ID `
            --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID --clientSecret $env:AZURE_AD_APPLICATION_SECRET
          msstore publish "smol-auto-clicker-$env:RELEASE_TAG-store.msixbundle" -id $env:STORE_PRODUCT_ID
