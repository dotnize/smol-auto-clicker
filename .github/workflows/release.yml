name: Prepare release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build release files
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
        run: ./scripts/build-release.ps1 -Tag $env:RELEASE_TAG
      - name: Create draft for review
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # Fail if this version already has a release; never replace reviewed files.
          $files = (Get-ChildItem dist -File | Where-Object Name -ne 'notes.md').FullName
          gh release create $env:RELEASE_TAG @files --verify-tag --draft `
            --title "Smol Auto Clicker $env:RELEASE_TAG" `
            --generate-notes --notes-file dist/notes.md
